[package]
name = "mazok"
version = "3.1.0"
edition = "2021"
description = "Мазок — приложение для цифрового рисования (Rust)"
license = "MIT"

[lib]
name = "mazok"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mazok-desktop"
path = "src/main.rs"

[dependencies]
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gif = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"
ab_glyph = "0.2"
rayon = "1"
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
arboard = { version = "3.4", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity", "rwh_06"] }
android_logger = "0.14"
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
